name: Publish OCI Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (input, else v* tag, else .asd :version)"
        required: false
        default: ""
      registry:
        description: "OCI registry"
        required: false
        default: "ghcr.io"

env:
  PDFIUM_BINARIES_TAG: chromium/8035

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Stage libpdfium (Unix)
        if: matrix.os != 'windows'
        run: |
          chmod +x scripts/stage-pdfium.sh
          ./scripts/stage-pdfium.sh "${{ matrix.os }}" "${{ matrix.arch }}"

      - name: Stage libpdfium (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          .\scripts\stage-pdfium.ps1 -Os windows -Arch amd64

      - name: Upload native artifact
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: native-bundle/

  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: ver
        shell: bash
        # input > vX.Y.Z tag > .asd :version (never a hardcoded default: a
        # plain dispatch once re-tagged 0.1.2 with 0.1.3 sources).
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$V" ]; then
            V="$(sed -nE 's/^[[:space:]]*:version[[:space:]]+"([^"]+)".*/\1/p' doc-extract-backend-pdf.asd | head -1)"
          fi
          [ -n "$V" ] || { echo "could not resolve package version" >&2; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

  publish:
    needs: [build, resolve-version]
    permissions:
      contents: read
      packages: write
    uses: egao1980/cl-repository/.github/workflows/publish-native-package.yml@main
    with:
      package-name: doc-extract-backend-pdf
      version: ${{ needs.resolve-version.outputs.version }}
      registry: ${{ inputs.registry || 'ghcr.io' }}
      source-paths: |
        doc-extract-backend-pdf.asd
        src
        LICENSE
        README.md
    secrets: inherit
